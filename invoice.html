<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tax Invoice & Receipt | Dhanalakshmi Crackers Sivakasi</title>
  <meta name="description" content="Official GST Tax Invoice and POS thermal receipt generator for Dhanalakshmi Crackers.">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/print.css">
  <style>

      background-color: #f1f5f9;

      justify-content: space-between;

    .toolbar-title {

      font-size: 1.15rem;

        align-items: stretch;

        padding: 0.65rem 0.75rem;
      }
      .format-pills {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        width: 100%;
      }
      .format-pill {

        padding: 0.4rem 0.2rem;

      }
      .invoice-toolbar {
        padding: 0.75rem;
        flex-direction: column;
        align-items: stretch;
        gap: 0.6rem;
      }
      .toolbar-title {
        font-size: 0.95rem;
        justify-content: center;
      }
      .toolbar-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        width: 100%;
        gap: 0.4rem;

      .toolbar-actions .btn {
        width: 100%;
        text-align: center;
        justify-content: center;
        font-size: 0.8rem;
        min-height: 38px;
      }
      .a4-inv-header {

        gap: 1rem;
      }
      .a4-meta-col {
        text-align: left;
      }
      .a4-details-grid {
        grid-template-columns: 1fr;

      .a4-summary-row {
        flex-direction: column;
      }
      .a4-summary-right {
        width: 100%;

  </style>
</head>
<body class="print-mode-a4">

  <div class="invoice-page-wrapper">
    <!-- Format Selector Bar (A4 / 80mm / 58mm) -->
    <div class="invoice-format-bar no-print">
      <span class="format-bar-label">Receipt Format:</span>
      <div class="format-pills">
        <button type="button" class="format-pill active" id="pillA4" onclick="setInvoiceFormat('a4')">
          📄 A4 Full Invoice
        </button>
        <button type="button" class="format-pill" id="pill80mm" onclick="setInvoiceFormat('80mm')">
          🧾 80mm POS Thermal
        </button>
        <button type="button" class="format-pill" id="pill58mm" onclick="setInvoiceFormat('58mm')">
          🧾 58mm Handheld Thermal
        </button>
      </div>
    </div>

    <!-- Action Toolbar (Hidden during print) -->
    <div class="invoice-toolbar no-print" id="invoiceToolbar">
      <div class="toolbar-title">
        <span id="toolbarIcon">📄</span>
        <span id="toolbarFormatTitle">Official Tax Invoice</span>
      </div>
      <div class="toolbar-actions">
        <button type="button" class="btn btn-secondary btn-sm" onclick="window.history.back()">
          &larr; Back
        </button>
        <button type="button" class="btn btn-secondary btn-sm" onclick="sendInvoiceWhatsApp()">
          📲 WhatsApp
        </button>
        <button type="button" class="btn btn-primary btn-sm" onclick="printCurrentInvoice()">
          🖨️ Print
        </button>
        <button type="button" class="btn btn-secondary btn-sm" id="btnDownloadPDF" onclick="downloadCurrentInvoicePDF()">
          📥 Download PDF
        </button>
      </div>
    </div>

    <!-- Printable Invoice Container -->
    <div id="invoiceContentToPrint">
      <!-- Dynamically generated according to selected format -->
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/whatsapp.js"></script>
  <script>
    let loadedInvoice = null;
    let currentFormat = "a4"; // "a4", "80mm", "58mm"

    function numberToIndianWords(amount) {
      const words = [
        '', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten',
        'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'
      ];
      const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];

      function numToWords(n) {
        if (n === 0) return '';
        if (n < 20) return words[n] + ' ';
        if (n < 100) return tens[Math.floor(n / 10)] + (n % 10 !== 0 ? ' ' + words[n % 10] : '') + ' ';
        if (n < 1000) return words[Math.floor(n / 100)] + ' Hundred ' + (n % 100 !== 0 ? numToWords(n % 100) : '');
        if (n < 100000) return numToWords(Math.floor(n / 1000)) + 'Thousand ' + (n % 1000 !== 0 ? numToWords(n % 1000) : '');
        if (n < 10000000) return numToWords(Math.floor(n / 100000)) + 'Lakh ' + (n % 100000 !== 0 ? numToWords(n % 100000) : '');
        return numToWords(Math.floor(n / 10000000)) + 'Crore ' + (n % 10000000 !== 0 ? numToWords(n % 10000000) : '');
      }

      const rounded = Math.round(Number(amount) || 0);
      if (rounded === 0) return 'INR Zero Only';
      return 'INR ' + numToWords(rounded).trim() + ' Only';
    }

    async function loadInvoiceData() {
      const urlParams = new URLSearchParams(window.location.search);
      const invoiceNum = urlParams.get("invoice") || urlParams.get("id") || urlParams.get("order");

      // Default format check from URL or settings
      const urlFormat = urlParams.get("format");
      if (urlFormat === "80mm" || urlFormat === "58mm" || urlFormat === "a4") {
        currentFormat = urlFormat;
      } else {
        const savedFormat = localStorage.getItem("dc_default_print_format");
        if (savedFormat) currentFormat = savedFormat;
      }

      const invoicesHistory = JSON.parse(localStorage.getItem("dc_invoices_history") || "[]");
      const ordersList = JSON.parse(localStorage.getItem("dc_orders_list") || "[]");

      let found = invoicesHistory.find(i => i.invoice_number === invoiceNum);

      if (!found && invoiceNum) {
        const ord = ordersList.find(o => o.order_number === invoiceNum);
        if (ord) {
          found = {
            invoice_number: ord.order_number,
            customer_name: ord.customer_name,
            customer_phone: ord.customer_phone,
            customer_address: ord.customer_address,
            subtotal: ord.subtotal || ord.total_amount,
            discount_amount: ord.discount || 0,
            tax_rate: 18,
            tax_amount: ord.tax_amount || 0,
            total_amount: ord.total_amount,
            payment_method: ord.payment_method || "UPI",
            payment_status: ord.payment_status || "paid",
            created_at: ord.created_at,
            items: ord.items || []
          };
        }
      }

      if (!found) {
        if (invoicesHistory.length > 0) {
          found = invoicesHistory[0];
        } else if (ordersList.length > 0) {
          const ord = ordersList[0];
          found = {
            invoice_number: ord.order_number,
            customer_name: ord.customer_name,
            customer_phone: ord.customer_phone,
            customer_address: ord.customer_address,
            subtotal: ord.subtotal || ord.total_amount,
            discount_amount: ord.discount || 0,
            tax_rate: 18,
            tax_amount: ord.tax_amount || 0,
            total_amount: ord.total_amount,
            payment_method: ord.payment_method || "UPI",
            payment_status: ord.payment_status || "paid",
            created_at: ord.created_at,
            items: ord.items || []
          };
        } else {
          // Demo invoice
          found = {
            invoice_number: "DC-20261012-001",
            customer_name: "SRI JAYA",
            customer_phone: "9003490490",
            customer_address: "No: 4, LIC Colony 1st Cross Street, Medical Road, Sivakasi",
            subtotal: 1899.00,
            discount_amount: 100.00,
            tax_rate: 18,
            tax_amount: 274.42,
            total_amount: 1799.00,
            payment_method: "UPI (Google Pay)",
            payment_status: "paid",
            created_at: new Date().toISOString(),
            items: [
              { product_name: "10cm Electric Sparklers (10 Pcs)", sku: "SPK-10EL", quantity: 5, unit_price: 35, subtotal: 175 },
              { product_name: "Ground Chakkars Deluxe (10 Pcs)", sku: "CHK-DLX10", quantity: 3, unit_price: 95, subtotal: 285 },
              { product_name: "12 Shots Aerial Spectacular Cake", sku: "SHT-12SKY", quantity: 1, unit_price: 380, subtotal: 380 },
              { product_name: "Dhanalakshmi Family Delight (25 Items Box)", sku: "BOX-DLT25", quantity: 1, unit_price: 799, subtotal: 799 }
            ]
          };
        }
      }

      loadedInvoice = found;
      setInvoiceFormat(currentFormat);

      if (urlParams.get("autoprint") === "true") {
        setTimeout(printCurrentInvoice, 600);
      } else if (urlParams.get("download") === "true") {
        setTimeout(downloadCurrentInvoicePDF, 800);
      }
    }

    function setInvoiceFormat(fmt) {
      currentFormat = fmt;
      document.body.className = `print-mode-${fmt}`;

      document.getElementById("pillA4").classList.toggle("active", fmt === "a4");
      document.getElementById("pill80mm").classList.toggle("active", fmt === "80mm");
      document.getElementById("pill58mm").classList.toggle("active", fmt === "58mm");

      const iconEl = document.getElementById("toolbarIcon");
      const titleEl = document.getElementById("toolbarFormatTitle");
      if (fmt === "a4") {
        iconEl.textContent = "📄";
        titleEl.textContent = "Official Tax Invoice (A4)";
      } else if (fmt === "80mm") {
        iconEl.textContent = "🧾";
        titleEl.textContent = "POS Counter Receipt (80mm)";
      } else {
        iconEl.textContent = "🧾";
        titleEl.textContent = "Mobile Thermal Receipt (58mm)";
      }

      renderInvoiceContent();
    }

    function renderInvoiceContent() {
      if (!loadedInvoice) return;
      const inv = loadedInvoice;
      const settings = JSON.parse(localStorage.getItem("dc_business_settings") || "{}");
      const shopName = settings.shop_name || "Dhanalakshmi Crackers";
      const shopAddress = settings.address || "Main Road, Thanjavur - 613001, Tamil Nadu";
      const shopPhone = settings.phone || "+91 94431 88531";
      const gstNo = settings.gst_number || "33AAAAA0000A1Z5";
      const defaultOfficialLogo = "https://res.cloudinary.com/dtbm1sjoo/image/upload/v1792332614/Ornate_Standard_Fireworks_Badge_1_hv1w6n.png";
      const logoUrl = settings.logo_url || defaultOfficialLogo;
      const isTaxApplicable = settings.tax_applicable !== false;
      const footerNote = settings.invoice_footer || "Thank you for shopping with Dhanalakshmi Crackers! Have a safe and sparkling celebration. 🪔";
      const dateStr = inv.created_at ? new Date(inv.created_at).toLocaleDateString("en-IN", { day: '2-digit', month: 'short', year: 'numeric' }) : new Date().toLocaleDateString("en-IN");
      const timeStr = inv.created_at ? new Date(inv.created_at).toLocaleTimeString("en-IN", { hour: '2-digit', minute: '2-digit' }) : "";

      const totalAmount = Number(inv.total_amount || 0);
      const subtotal = Number(inv.subtotal || totalAmount);
      const discountAmount = Number(inv.discount_amount || 0);
      const taxAmount = Number(inv.tax_amount || (isTaxApplicable ? (totalAmount * 0.18 / 1.18) : 0));
      const cgst = Number((taxAmount / 2).toFixed(2));
      const sgst = Number((taxAmount / 2).toFixed(2));

      const container = document.getElementById("invoiceContentToPrint");

      if (currentFormat === "a4") {
        container.className = "invoice-paper format-a4";
        container.innerHTML = `
          <!-- A4 Official Header -->
          <div class="a4-inv-header">
            <div class="a4-brand-col">
              <div class="a4-brand-title-wrap">
                ${logoUrl ? `<img src="${logoUrl}" alt="${shopName}" class="a4-brand-img" onerror="this.outerHTML='<span class=\\'a4-brand-logo\\'>🪔</span>'">` : `<span class="a4-brand-logo">🪔</span>`}
                <div>
                  <div class="a4-brand-name">${shopName}</div>
                  <div class="a4-brand-tagline">Direct from Sivakasi - Certified Factory Fireworks</div>
                </div>
              </div>
              <div class="a4-brand-meta">
                📍 ${shopAddress}<br>
                📞 Helpline: ${shopPhone} | ✉️ contact@dhanalakshmicrackers.com<br>
                <strong>GSTIN:</strong> ${gstNo} | <strong>State:</strong> Tamil Nadu (Code: 33) | <strong>HSN:</strong> 3604
              </div>
            </div>

            <div class="a4-meta-col">
              <span class="a4-doc-type-badge">${isTaxApplicable ? 'TAX INVOICE' : 'RETAIL INVOICE'}</span>
              <div class="a4-inv-num">#${inv.invoice_number}</div>
              <div class="a4-inv-date">Date: <strong>${dateStr}</strong> ${timeStr ? `&bull; ${timeStr}` : ''}</div>
              <div class="a4-status-badge ${inv.payment_status === 'paid' ? 'a4-status-paid' : 'a4-status-unpaid'}">
                ● ${(inv.payment_status || 'PAID').toUpperCase()}
              </div>
            </div>
          </div>

          <!-- Customer & Dispatch Details Grid -->
          <div class="a4-details-grid">
            <div class="a4-info-card">
              <div class="a4-card-heading">BILLED TO (CUSTOMER DETAILS)</div>
              <div class="a4-cust-name">${inv.customer_name || 'Walk-in Customer'}</div>
              <div class="a4-cust-line">📱 <strong>Phone:</strong> ${inv.customer_phone ? '+91 ' + String(inv.customer_phone).replace(/[^0-9]/g,'').slice(-10) : 'Direct Counter Pickup'}</div>
              <div class="a4-cust-line">📍 <strong>Address:</strong> ${inv.customer_address || 'Sivakasi Store Counter Pickup'}</div>
            </div>

            <div class="a4-info-card">
              <div class="a4-card-heading">INVOICE & PAYMENT SUMMARY</div>
              <div class="a4-cust-line">💳 <strong>Payment Method:</strong> ${inv.payment_method || 'UPI / Cash'}</div>
              <div class="a4-cust-line">🏷️ <strong>Supply Type:</strong> Sivakasi Direct Factory Supply</div>
              <div class="a4-cust-line">🌐 <strong>Place of Supply:</strong> Tamil Nadu (State Code: 33)</div>
              <div class="a4-cust-line">⚖️ <strong>Reverse Charge:</strong> No</div>
            </div>
          </div>

          <!-- Itemized Table -->
          <div class="a4-table-wrap">
            <table class="a4-table">
              <thead>
                <tr>
                  <th style="width: 40px; text-align: center;">#</th>
                  <th>Description of Goods (Fireworks)</th>
                  <th style="width: 65px; text-align: center;">HSN</th>
                  <th style="width: 55px; text-align: center;">Qty</th>
                  <th style="width: 85px; text-align: right;">Rate (₹)</th>
                  <th style="width: 95px; text-align: right;">Taxable (₹)</th>
                  <th style="width: 80px; text-align: right;">GST (18%)</th>
                  <th style="width: 100px; text-align: right;">Amount (₹)</th>
                </tr>
              </thead>
              <tbody>
                ${(inv.items || []).map((item, idx) => {
                  const itemTotal = Number(item.subtotal || (Number(item.unit_price || 0) * Number(item.quantity || 1)));
                  const itemTaxable = Number((itemTotal / 1.18).toFixed(2));
                  const itemGst = Number((itemTotal - itemTaxable).toFixed(2));
                  return `
                    <tr>
                      <td style="text-align: center; color: #64748b;">${idx + 1}</td>
                      <td>
                        <div class="a4-item-name">${item.product_name}</div>
                        <div class="a4-item-sku">SKU: ${item.sku || 'SIV-' + (idx + 101)}</div>
                      </td>
                      <td style="text-align: center; color: #475569;">3604</td>
                      <td style="text-align: center; font-weight: 700;">${item.quantity}</td>
                      <td style="text-align: right;">${Number(item.unit_price).toFixed(2)}</td>
                      <td style="text-align: right;">${itemTaxable.toFixed(2)}</td>
                      <td style="text-align: right; color: #475569;">${itemGst.toFixed(2)}</td>
                      <td style="text-align: right; font-weight: 700;">${itemTotal.toFixed(2)}</td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>

          <!-- Calculation and Words Row -->
          <div class="a4-summary-row">
            <div class="a4-summary-left">
              <div class="a4-words-card">
                <div class="a4-words-label">AMOUNT CHARGEABLE (IN WORDS)</div>
                <div class="a4-words-val">${numberToIndianWords(totalAmount)}</div>
              </div>
              <div class="a4-payment-meta">
                <strong>UPI ID:</strong> ${settings.upi_id || 'dhanalakshmi@upi'}<br>
                <strong>Payment Reference:</strong> Verified Digital Transaction (${inv.payment_method})
              </div>
            </div>

            <div class="a4-summary-right">
              <div class="a4-calc-line">
                <span>Items Subtotal:</span>
                <span>₹${subtotal.toFixed(2)}</span>
              </div>
              ${discountAmount > 0 ? `
                <div class="a4-calc-line a4-calc-discount">
                  <span>Festival Discount:</span>
                  <span>-₹${discountAmount.toFixed(2)}</span>
                </div>
              ` : ''}
              ${isTaxApplicable ? `
                <div class="a4-calc-line">
                  <span>CGST (9.0%):</span>
                  <span>₹${cgst.toFixed(2)}</span>
                </div>
                <div class="a4-calc-line">
                  <span>SGST (9.0%):</span>
                  <span>₹${sgst.toFixed(2)}</span>
                </div>
              ` : ''}
              <div class="a4-calc-grand">
                <span>TOTAL AMOUNT:</span>
                <span>₹${totalAmount.toFixed(2)}</span>
              </div>
            </div>
          </div>

          <!-- Footer & Statutory Disclaimer -->
          <div class="a4-inv-footer">
            <div class="a4-terms-col">
              <strong>Terms & Safety Information:</strong><br>
              1. 100% PESO Certified fireworks manufactured strictly under Indian safety regulations.<br>
              2. Store in a cool, dry place. Light outdoors only under adult supervision.<br>
              3. This is a computer-generated tax invoice and requires no physical signature.<br>
              <em>${footerNote}</em>
            </div>
            <div class="a4-sign-col">
              <div class="a4-sign-space"></div>
              <div class="a4-sign-label">For ${shopName}</div>
              <div class="a4-sign-sub">Authorized Signatory</div>
            </div>
          </div>
        `;
      } else {
        // Thermal Receipt Format (80mm or 58mm)
        const is80 = currentFormat === "80mm";
        container.className = `invoice-print-container format-${currentFormat}`;

        const upiId = settings.upi_id || "dhanalakshmi@upi";
        const upiUri = `upi://pay?pa=${encodeURIComponent(upiId)}&pn=${encodeURIComponent(shopName)}&am=${totalAmount.toFixed(2)}&cu=INR&tn=${encodeURIComponent('Bill ' + inv.invoice_number)}`;
        const qrImgUrl = `https://api.qrserver.com/v1/create-qr-code/?size=${is80 ? '110x110' : '90x90'}&margin=4&data=${encodeURIComponent(upiUri)}`;

        container.innerHTML = `
          <div class="thermal-center">
            <div class="thermal-logo-wrap">
              <img src="${logoUrl}" alt="${shopName}" class="thermal-brand-logo-img" onerror="this.style.display='none'">
            </div>
            <div class="thermal-shop-name">${shopName}</div>
            <div class="thermal-meta">${shopAddress}</div>
            <div class="thermal-meta">Helpline: ${shopPhone}</div>
            ${gstNo ? `<div class="thermal-meta">GSTIN: ${gstNo} | State: 33</div>` : ''}
          </div>

          <div class="thermal-divider"></div>

          <div class="thermal-row">
            <span>Bill: ${inv.invoice_number}</span>
            <span>${dateStr}</span>
          </div>
          <div class="thermal-row">
            <span>Cust: ${inv.customer_name || 'Walk-in'}</span>
            <span>${timeStr}</span>
          </div>
          ${inv.customer_phone ? `<div class="thermal-row"><span>Mobile:</span><span>${inv.customer_phone}</span></div>` : ''}

          <div class="thermal-double-divider"></div>

          <table class="thermal-table">
            <thead>
              <tr>
                <th style="text-align: left;">Item Description</th>
                <th style="text-align: center; width: 35px;">Qty</th>
                <th class="text-right" style="width: ${is80 ? '70px' : '55px'};">Amount</th>
              </tr>
            </thead>
            <tbody>
              ${(inv.items || []).map(item => `
                <tr>
                  <td>
                    <div class="thermal-item-title">${item.product_name}</div>
                    <div class="thermal-item-sub">${item.quantity} x ₹${Number(item.unit_price).toFixed(2)}</div>
                  </td>
                  <td style="text-align: center; font-weight: 700; padding-top: 3px;">${item.quantity}</td>
                  <td class="text-right" style="font-weight: 700; padding-top: 3px;">₹${Number(item.subtotal).toFixed(2)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>

          <div class="thermal-divider"></div>

          <div class="thermal-row">
            <span>Subtotal:</span>
            <span>₹${subtotal.toFixed(2)}</span>
          </div>

          ${discountAmount > 0 ? `
            <div class="thermal-row">
              <span>Festival Discount:</span>
              <span>-₹${discountAmount.toFixed(2)}</span>
            </div>
          ` : ''}

          ${isTaxApplicable ? `
            <div class="thermal-row" style="font-size:${is80 ? '10px' : '8.5px'};">
              <span>CGST (9%) + SGST (9%):</span>
              <span>₹${taxAmount.toFixed(2)}</span>
            </div>
          ` : ''}

          <div class="thermal-double-divider"></div>

          <div class="thermal-row thermal-bold" style="font-size: ${is80 ? '14px' : '12px'};">
            <span>NET PAYABLE:</span>
            <span>₹${totalAmount.toFixed(2)}</span>
          </div>

          <div class="thermal-row" style="margin-top: 3px;">
            <span>Payment Mode:</span>
            <span><strong>${inv.payment_method || 'CASH'} (${(inv.payment_status || 'PAID').toUpperCase()})</strong></span>
          </div>

          <div class="thermal-divider"></div>

          <!-- Thermal UPI QR for Verification -->
          <div class="thermal-qr-box">
            <img src="${qrImgUrl}" alt="Scan UPI" class="thermal-qr-img">
            <div style="font-size: ${is80 ? '9px' : '7.5px'}; margin-top: 3px; font-weight: 700;">SCAN TO VERIFY / PAY VIA UPI</div>
          </div>

          <div class="thermal-footer">
            ${footerNote}<br>
            PESO Certified Fireworks.<br>
            *** THANK YOU - VISIT AGAIN ***
          </div>
        `;
      }
    }

    function printCurrentInvoice() {
      document.body.className = `print-mode-${currentFormat}`;
      window.print();
    }

    function downloadCurrentInvoicePDF() {
      if (!loadedInvoice) return;
      const element = document.getElementById("invoiceContentToPrint");
      const btn = document.getElementById("btnDownloadPDF");

      if (btn) {
        btn.disabled = true;
        btn.textContent = "⏳ Generating...";
      }

      const fileName = `Receipt-${loadedInvoice.invoice_number}-${currentFormat}.pdf`;

      let pdfFormat = 'a4';
      if (currentFormat === '80mm') {
        pdfFormat = [80, 240];
      } else if (currentFormat === '58mm') {
        pdfFormat = [58, 200];
      }

      if (typeof html2pdf !== "undefined") {
        const opt = {
          margin: currentFormat === 'a4' ? [8, 8, 8, 8] : [2, 2, 2, 2],
          filename: fileName,
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2, useCORS: true, logging: false },
          jsPDF: { unit: 'mm', format: pdfFormat, orientation: 'portrait' }
        };

        html2pdf().set(opt).from(element).save().then(() => {
          if (btn) {
            btn.disabled = false;
            btn.textContent = "📥 Download PDF";
          }
        }).catch(err => {
          console.warn("html2pdf error, triggering window.print():", err);
          printCurrentInvoice();
          if (btn) {
            btn.disabled = false;
            btn.textContent = "📥 Download PDF";
          }
        });
      } else {
        printCurrentInvoice();
        if (btn) {
          btn.disabled = false;
          btn.textContent = "📥 Download PDF";
        }
      }
    }

    function sendInvoiceWhatsApp() {
      if (!loadedInvoice) return;
      const phone = loadedInvoice.customer_phone || prompt("Enter customer WhatsApp mobile number (10 digits):");
      if (!phone) return;

      const settings = JSON.parse(localStorage.getItem("dc_business_settings") || "{}");
      const invoiceDownloadUrl = `${window.location.origin}/invoice.html?invoice=${loadedInvoice.invoice_number}&format=${currentFormat}`;

      let message = 
`🎆 *${settings.shop_name || 'Dhanalakshmi Crackers'}* 🎆
_Direct from Sivakasi - Safe & Certified Fireworks_

🧾 *TAX INVOICE: #${loadedInvoice.invoice_number}*
👤 *Customer:* ${loadedInvoice.customer_name}
💰 *Total Amount:* ₹${Number(loadedInvoice.total_amount).toFixed(2)}
💳 *Payment:* ${loadedInvoice.payment_method} (PAID)
━━━━━━━━━━━━━━━━━━━━━
📄 *View / Download Receipt (${currentFormat.toUpperCase()}):*
${invoiceDownloadUrl}
━━━━━━━━━━━━━━━━━━━━━
✨ Thank you for celebrating with us! Wishing you a sparkling and safe Diwali! 🪔`;

      const prefill = (phone && /\d/.test(phone)) ? String(phone).replace(/[^0-9]/g, "") : "";
      const cleanPhone = String(phone).replace(/[^0-9]/g, "");
      const waPhone = cleanPhone.length === 10 ? "91" + cleanPhone : cleanPhone;
      const waUrl = `https://api.whatsapp.com/send?phone=${waPhone}&text=${encodeURIComponent(message)}`;

      const link = document.createElement("a");
      link.href = waUrl;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      const isMobile = /Android|iPhone|iPad|iPod|Opera Mini|IEMobile/i.test(navigator.userAgent) || window.innerWidth < 768;
      if (isMobile) {
        setTimeout(() => {
          if (!document.hidden) window.location.href = waUrl;
        }, 400);
      }
    }

    document.addEventListener("DOMContentLoaded", loadInvoiceData);
  </script>
