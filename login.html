<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin & Staff Login | Dhanalakshmi Crackers</title>
  <meta name="description" content="Secure administrative and POS billing terminal login for Dhanalakshmi Crackers management staff.">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/print.css">
</head>
<body class="login-page-body">

  <div class="login-card">
    <div class="login-header">
      <div class="login-icon-box">
        🪔
      </div>
      <h1 class="login-card-title">
        Staff & Admin Login
      </h1>
      <p class="login-card-sub">
        Dhanalakshmi Crackers Sivakasi Management
      </p>
    </div>

    <!-- Error Alert Banner -->
    <div id="loginErrorAlert" class="login-error-alert">
    </div>

    <form id="adminLoginForm">
      <div class="form-group">
        <label class="form-label" for="loginEmail">Email Address</label>
        <input type="email" id="loginEmail" class="form-input" placeholder="admin@dhanalakshmicrackers.com" value="admin@dhanalakshmicrackers.com" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="loginPassword">Password</label>
        <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" value="admin123" required>
      </div>

      <button type="submit" id="btnLoginSubmit" class="btn btn-primary btn-block login-submit-btn">
        Sign In to POS & Dashboard &rarr;
      </button>
    </form>

    <!-- Demo Notice -->
    <div class="login-demo-notice">
      💡 <strong>Default Demo Access:</strong><br>
      Email: <code>admin@dhanalakshmicrackers.com</code><br>
      Password: <code>admin123</code><br>
      <span class="login-demo-sub">Connect your Supabase project in Admin &rarr; Settings to activate live authentication.</span>
    </div>

    <div class="login-footer-nav">
      <a href="index.html" class="login-back-link">
        &larr; Return to Customer Storefront
      </a>
    </div>
  </div>


  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    document.getElementById("adminLoginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("loginEmail").value.trim();
      const pass = document.getElementById("loginPassword").value.trim();
      const btn = document.getElementById("btnLoginSubmit");
      const errEl = document.getElementById("loginErrorAlert");

      btn.disabled = true;
      btn.textContent = "Verifying...";
      errEl.style.display = "none";

      const result = await handleAdminLogin(email, pass);
      if (result.success) {
        window.location.href = "admin/index.html";
      } else {
        errEl.textContent = result.error || "Login failed.";
        errEl.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Sign In to POS & Dashboard →";
      }
    });
  </script>
</body>
</html>
